name: Deploy to Emerald

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  actions: read
  contents: read

concurrency:
  group: emerald-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Download the successful main build artifact
        uses: actions/download-artifact@v4
        with:
          name: aslal-emerald-${{ github.event.workflow_run.head_sha }}
          path: emerald-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify deployment artifact
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          ARCHIVE="emerald-artifact/aslal-emerald-$SHA.tar.gz"
          test -f "$ARCHIVE"
          tar -tzf "$ARCHIVE" >/dev/null
          echo "Artifact verified: $ARCHIVE"
          sha256sum "$ARCHIVE"

      - name: Configure SSH
        env:
          EMERALD_HOST: ${{ secrets.EMERALD_HOST }}
          EMERALD_PORT: ${{ secrets.EMERALD_PORT }}
          EMERALD_USER: ${{ secrets.EMERALD_USER }}
          EMERALD_SSH_KEY: ${{ secrets.EMERALD_SSH_KEY }}
          EMERALD_KNOWN_HOSTS: ${{ secrets.EMERALD_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$EMERALD_HOST"
          test -n "$EMERALD_USER"
          test -n "$EMERALD_SSH_KEY"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$EMERALD_SSH_KEY" > ~/.ssh/emerald_deploy
          chmod 600 ~/.ssh/emerald_deploy

          if [ -n "${EMERALD_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$EMERALD_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${EMERALD_PORT:-22}" "$EMERALD_HOST" >> ~/.ssh/known_hosts
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Upload artifact to Emerald
        env:
          EMERALD_HOST: ${{ secrets.EMERALD_HOST }}
          EMERALD_PORT: ${{ secrets.EMERALD_PORT }}
          EMERALD_USER: ${{ secrets.EMERALD_USER }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          scp             -i ~/.ssh/emerald_deploy             -P "${EMERALD_PORT:-22}"             -o BatchMode=yes             -o StrictHostKeyChecking=yes             "emerald-artifact/aslal-emerald-$SHA.tar.gz"             "${EMERALD_USER}@${EMERALD_HOST}:~/aslal-emerald-$SHA.tar.gz"

     - name: Configure SSH
  env:
    EMERALD_HOST: ${{ secrets.EMERALD_HOST }}
    EMERALD_PORT: ${{ secrets.EMERALD_PORT }}
    EMERALD_USER: ${{ secrets.EMERALD_USER }}
    EMERALD_SSH_KEY: ${{ secrets.EMERALD_SSH_KEY }}
    EMERALD_KNOWN_HOSTS: ${{ secrets.EMERALD_KNOWN_HOSTS }}
  run: |
    set -euo pipefail

    test -n "$EMERALD_HOST"
    test -n "$EMERALD_USER"
    test -n "$EMERALD_SSH_KEY"

    mkdir -p ~/.ssh
    chmod 700 ~/.ssh

    printf '%s\n' "$EMERALD_SSH_KEY" | tr -d '\r' > ~/.ssh/emerald_deploy
    chmod 600 ~/.ssh/emerald_deploy

    echo "SSH key header:"
    head -n 1 ~/.ssh/emerald_deploy | sed 's/./*/g'

    echo "SSH key footer:"
    tail -n 1 ~/.ssh/emerald_deploy | sed 's/./*/g'

    echo "Testing private key format..."
    ssh-keygen -y -f ~/.ssh/emerald_deploy > /tmp/emerald_public_key

    echo "Private key format is valid."

    if [ -n "${EMERALD_KNOWN_HOSTS:-}" ]; then
      printf '%s\n' "$EMERALD_KNOWN_HOSTS" > ~/.ssh/known_hosts
    else
      ssh-keyscan -p "${EMERALD_PORT:-22}" "$EMERALD_HOST" >> ~/.ssh/known_hosts
    fi

    chmod 644 ~/.ssh/known_hosts

          tar -xzf "$ARCHIVE" -C "$RELEASE_PATH"

          test -f "$RELEASE_PATH/server.js"
          test -d "$RELEASE_PATH/.next/static"
          test -d "$RELEASE_PATH/public"

          # Keep the existing production environment file. It is never replaced
          # by the GitHub Actions artifact.
          if [ -f "$APP_PATH/.env" ]; then
            cp "$APP_PATH/.env" "$RELEASE_PATH/.env"
          fi

          # Keep a rollback copy of the currently deployed runtime.
          rm -rf "$BACKUP_PATH"
          mkdir -p "$BACKUP_PATH"

          for item in server.js package.json node_modules .next public; do
            if [ -e "$APP_PATH/$item" ]; then
              cp -a "$APP_PATH/$item" "$BACKUP_PATH/$item"
            fi
          done

          # Replace only the standalone runtime files.
          rm -rf             "$APP_PATH/.next"             "$APP_PATH/node_modules"             "$APP_PATH/public"             "$APP_PATH/server.js"             "$APP_PATH/package.json"

          cp -a "$RELEASE_PATH/server.js" "$APP_PATH/server.js"
          cp -a "$RELEASE_PATH/package.json" "$APP_PATH/package.json"
          cp -a "$RELEASE_PATH/node_modules" "$APP_PATH/node_modules"
          cp -a "$RELEASE_PATH/.next" "$APP_PATH/.next"
          cp -a "$RELEASE_PATH/public" "$APP_PATH/public"

          # Passenger restart.
          mkdir -p "$APP_PATH/tmp"
          touch "$APP_PATH/tmp/restart.txt"

          test -f "$APP_PATH/server.js"
          test -d "$APP_PATH/.next/static"

          rm -f "$ARCHIVE"

          echo "Emerald deployment installed: $SHA"
          echo "Passenger restart requested."
          REMOTE

      - name: Verify production health endpoint
        env:
          EMERALD_HEALTH_URL: ${{ secrets.EMERALD_HEALTH_URL }}
        run: |
          set -euo pipefail
          URL="${EMERALD_HEALTH_URL:-https://aslaldigital.com/api/health}"
          echo "Checking $URL"

          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error --max-time 20 "$URL"; then
              echo
              echo "Production health check passed."
              exit 0
            fi

            echo "Health check attempt $attempt failed; waiting 10 seconds..."
            sleep 10
          done

          echo "Production health check failed."
          exit 1
