name: Sales Follow-up Automation

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sales-followup-automation
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Run scheduled automation
        env:
          TOKEN: ${{ secrets.AUTOMATION_CRON_TOKEN }}
          URL: ${{ secrets.AUTOMATION_CRON_URL }}
        run: |
          set -euo pipefail
          TARGET_URL="${URL:-https://aslaldigital.com/api/cron/sales-automation}"
          if [ -z "${TOKEN:-}" ]; then
            echo "AUTOMATION_CRON_TOKEN is not configured; Phase 5 scheduler is intentionally inactive."
            exit 0
          fi
          response="$(curl --fail --silent --show-error --max-time 30 -H "Authorization: Bearer $TOKEN" -H "Accept: application/json" "$TARGET_URL")"
          echo "$response" | python3 -c '
          import json, sys
          data=json.load(sys.stdin)
          print(json.dumps(data, indent=2))
          if not data.get("ok"):
              raise SystemExit("Sales automation run failed")
          '
