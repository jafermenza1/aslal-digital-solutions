name: Cleanup GitHub Actions Artifacts

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale deployment artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          cutoff_epoch="$(date -u -d '24 hours ago' +%s)"
          deleted=0

          while IFS=$'\t' read -r artifact_id created_at expired; do
            [ -n "${artifact_id:-}" ] || continue

            created_epoch="$(date -u -d "$created_at" +%s)"
            if [ "$expired" = "true" ] || [ "$created_epoch" -lt "$cutoff_epoch" ]; then
              echo "Deleting artifact $artifact_id created at $created_at (expired=$expired)"
              gh api --method DELETE "repos/$REPO/actions/artifacts/$artifact_id"
              deleted=$((deleted + 1))
            fi
          done < <(
            gh api --paginate "repos/$REPO/actions/artifacts?per_page=100"               --jq '.artifacts[] | [.id, .created_at, .expired] | @tsv'
          )

          echo "Deleted $deleted stale/expired artifact(s)."
