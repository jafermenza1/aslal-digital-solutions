name: Production Integrity Check

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check production data integrity
        env:
          URL: ${{ secrets.PRODUCTION_INTEGRITY_URL }}
          TOKEN: ${{ secrets.PRODUCTION_INTEGRITY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$URL"
          test -n "$TOKEN"
          response="$(curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/json" \
            "$URL")"
          echo "$response" | python3 -c '
          import json, sys
          data=json.load(sys.stdin)
          print(json.dumps(data, indent=2))
          if not data.get("passed"):
              raise SystemExit("Production integrity check failed")
          '
