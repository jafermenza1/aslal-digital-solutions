name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Verify standalone bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f .next/standalone/server.js
          test -f .next/standalone/package.json
          test -d .next/standalone/.next/static
          test -d .next/standalone/public
          echo "Standalone bundle verified."

      - name: Package Emerald deployment artifact
        shell: bash
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          ARCHIVE="aslal-emerald-${SHA}.tar.gz"
          tar -C .next/standalone -czf "$ARCHIVE" .
          test -s "$ARCHIVE"
          tar -tzf "$ARCHIVE" >/dev/null
          echo "Created $ARCHIVE"
          sha256sum "$ARCHIVE"

      - name: Upload Emerald deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: aslal-emerald-${{ github.sha }}
          path: aslal-emerald-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 14
