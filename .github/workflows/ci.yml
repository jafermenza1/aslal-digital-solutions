name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Package Emerald standalone bundle
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          rm -rf emerald-deploy

          # Fail here if Next did not produce the standalone runtime.
          test -d .next/standalone
          test -f .next/standalone/server.js
          test -d .next/standalone/.next
          test -d .next/standalone/.next/static

          mkdir -p emerald-deploy
          cp -R .next/standalone/. emerald-deploy/

          # Passenger starts server.js; keep Next's generated server separately.
          mv emerald-deploy/server.js emerald-deploy/next-server.js
          cat > emerald-deploy/server.js <<'NODE'
          const path = require("node:path");
          const Module = require("node:module");

          const runtimeNodeModules = path.join(__dirname, "node_modules");
          process.env.NODE_PATH = [runtimeNodeModules, process.env.NODE_PATH || ""]
            .filter(Boolean)
            .join(path.delimiter);
          Module._initPaths();

          require(path.join(__dirname, "next-server.js"));
          NODE

          mkdir -p emerald-deploy/prisma emerald-deploy/.prisma-cli
          cp -R prisma/. emerald-deploy/prisma/
          printf '%s\n' '{"name":"aslal-prisma-migration-runtime","private":true}' > emerald-deploy/.prisma-cli/package.json
          npm install --prefix emerald-deploy/.prisma-cli --no-audit --no-fund --no-package-lock prisma@6.19.0

          test -f emerald-deploy/server.js
          test -f emerald-deploy/next-server.js
          test -d emerald-deploy/.next
          test -d emerald-deploy/.next/static
          test -d emerald-deploy/public
          test -x emerald-deploy/.prisma-cli/node_modules/.bin/prisma
          test -d emerald-deploy/prisma/migrations
          node --check emerald-deploy/server.js
          node --check emerald-deploy/next-server.js

          tar -czf aslal-emerald-${RELEASE_SHA}.tar.gz -C emerald-deploy .

          echo "=== Emerald artifact manifest ==="
          tar -tzf aslal-emerald-${RELEASE_SHA}.tar.gz | grep -E '(^|/)(server\.js|next-server\.js|\.next/|public/)'
          tar -tzf aslal-emerald-${RELEASE_SHA}.tar.gz | grep -Eq '(^|/)server\.js$'
          tar -tzf aslal-emerald-${RELEASE_SHA}.tar.gz | grep -Eq '(^|/)next-server\.js$'
          tar -tzf aslal-emerald-${RELEASE_SHA}.tar.gz | grep -Eq '(^|/)\.next/static/'

      - name: Upload Emerald deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: aslal-emerald-${{ github.sha }}
          path: aslal-emerald-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 3
