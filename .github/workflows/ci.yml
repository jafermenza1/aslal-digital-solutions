name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Package Emerald standalone bundle
        run: |
          rm -rf emerald-deploy
          mkdir -p emerald-deploy
          cp -R .next/standalone/. emerald-deploy/
          test -f emerald-deploy/server.js
          test -d emerald-deploy/.next/static
          test -d emerald-deploy/public
          tar -czf aslal-emerald-${GITHUB_SHA}.tar.gz -C emerald-deploy .

      - name: Upload Emerald deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: aslal-emerald-${{ github.sha }}
          path: aslal-emerald-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 14
