name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Package Emerald standalone bundle
        run: |
          set -euo pipefail
          rm -rf emerald-deploy
          mkdir -p emerald-deploy
          cp -R .next/standalone/. emerald-deploy/
          # CloudLinux Passenger may inject its virtualenv into Node's global
          # module lookup. Keep the generated Next server inside the release so
          # its local node_modules resolve first; server.js becomes a tiny
          # launcher that can be copied to the application root safely.
          mv emerald-deploy/server.js emerald-deploy/next-server.js
          printf '%s\\n' \
            'const path = require("node:path");' \
            'const Module = require("node:module");' \
            '' \
            'const runtimeNodeModules = path.join(__dirname, "node_modules");' \
            'process.env.NODE_PATH = [runtimeNodeModules, process.env.NODE_PATH || ""]' \
            '  .filter(Boolean)' \
            '  .join(path.delimiter);' \
            'Module._initPaths();' \
            '' \
            'require(path.join(__dirname, "next-server.js"));' \
            > emerald-deploy/server.js

          # Ship migrations and a complete, isolated Prisma CLI installation.
          # The standalone dependency tracer is for the web runtime and can
          # omit CLI-only transitive dependencies such as effect/fast-check.
          mkdir -p emerald-deploy/prisma emerald-deploy/.prisma-cli
          cp -R prisma/. emerald-deploy/prisma/
          printf '%s\n' '{"name":"aslal-prisma-migration-runtime","private":true}' > emerald-deploy/.prisma-cli/package.json
          npm install --prefix emerald-deploy/.prisma-cli --no-audit --no-fund --no-package-lock prisma@6.19.0

          test -f emerald-deploy/server.js
          test -d emerald-deploy/.next/static
          test -d emerald-deploy/public
          test -x emerald-deploy/.prisma-cli/node_modules/.bin/prisma
          test -d emerald-deploy/prisma/migrations
          tar -czf aslal-emerald-${GITHUB_SHA}.tar.gz -C emerald-deploy .

      - name: Upload Emerald deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: aslal-emerald-${{ github.sha }}
          path: aslal-emerald-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 3
