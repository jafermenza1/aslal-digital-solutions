name: Build and Push to Deploy Branch

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Only one build is allowed to publish the deploy branch at a time.
# If several main commits arrive together, the newest run replaces the older run.
concurrency:
  group: aslal-production-build
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Remove non-deployable Next.js build cache
        run: |
          set -euo pipefail
          # .next/cache is generated build state and is not required at runtime.
          # Keeping it out of the deploy branch avoids GitHub's 100 MB file limit.
          rm -rf .next/cache

      - name: Publish production build to deploy branch
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Publish the runtime build only. The source tree on main remains unchanged.
          git add -f .next

          if git diff --cached --quiet; then
            echo "No .next changes to publish."
            exit 0
          fi

          git commit -m "build: attach production build output"

          # A deploy build may finish while another run has updated deploy.
          # Refresh the remote ref and retry so transient ref-lock races do not
          # fail an otherwise valid production build.
          for attempt in 1 2 3; do
            git fetch origin deploy
            if git push origin HEAD:deploy --force; then
              echo "Deploy branch published successfully."
              exit 0
            fi
            echo "Deploy branch changed during push; retrying ($attempt/3)..."
            sleep 3
          done

          echo "Unable to publish deploy branch after 3 attempts."
          exit 1
