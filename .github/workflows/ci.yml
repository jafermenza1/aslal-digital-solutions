name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/aslal_ci

jobs:
  lint:
    name: Lint
    # Validation-only gate: no deployment or production side effects.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint

  typecheck:
    name: Typecheck + Prisma
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npm run prisma:generate
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Typecheck
        run: npm run typecheck

  build:
    name: Production build
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npm run prisma:generate
      - name: Validate Prisma schema
        run: npx prisma validate
      - name: Production build
        run: npm run build
      - name: Hardening control tests
        run: npm run hardening:test

      - name: Prepare Emerald deployment bundle
        run: |
          set -euo pipefail

          rm -rf .prisma-cli emerald-artifact
          mkdir -p .prisma-cli emerald-artifact

          npm install --prefix .prisma-cli --no-save --no-package-lock prisma@6.19.0

          test -f .next/standalone/server.js
          test -f .next/standalone/package.json
          test -d .next/standalone/.next/static
          test -d .next/standalone/public
          test -x .prisma-cli/node_modules/.bin/prisma
          test -d prisma/migrations

          rm -rf .next/standalone/prisma .next/standalone/.prisma-cli
          cp -a prisma .next/standalone/prisma
          cp -a .prisma-cli .next/standalone/.prisma-cli

          SHA="${GITHUB_SHA}"
          tar -czf "emerald-artifact/aslal-emerald-$SHA.tar.gz" -C .next/standalone .

          test -f "emerald-artifact/aslal-emerald-$SHA.tar.gz"
          tar -tzf "emerald-artifact/aslal-emerald-$SHA.tar.gz" >/dev/null
          sha256sum "emerald-artifact/aslal-emerald-$SHA.tar.gz"

      - name: Upload Emerald deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: aslal-emerald-${{ github.sha }}
          path: emerald-artifact/aslal-emerald-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 7

# Validation gate remains enabled; production deployment remains manual-only.
# Typecheck fixes validated through GitHub Actions.
