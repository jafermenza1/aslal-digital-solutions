name: One-Time Dependency Lock Refresh

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh:
    if: contains(github.event.head_commit.message, '[refresh-lock]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit

      - name: Commit refreshed lockfile and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-dependency-lock-refresh.yml
          git add package-lock.json
          git diff --cached --quiet && {
            echo "No lockfile changes were generated."
            exit 1
          }
          git commit -m "chore: refresh dependency lockfile"
          git push origin HEAD:main
