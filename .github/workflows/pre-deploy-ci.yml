name: Pre-Deployment CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pre-deploy-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: mysql://ci:ci@127.0.0.1:3306/aslal_ci

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run typecheck

  prisma:
    name: Prisma schema/client validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx prisma validate

  brand:
    name: Brand/color contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run brand:check

  seo:
    name: SEO/georoute contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run seo:check

  pcce:
    name: Public commerce contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run pcce-1:check

  security:
    name: Production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run build

  ci-gate:
    name: Pre-deployment CI gate
    if: always()
    needs: [lint, typecheck, prisma, brand, seo, pcce, security, build]
    runs-on: ubuntu-latest
    steps:
      - name: Require every parallel check to pass
        env:
          LINT: ${{ needs.lint.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
          PRISMA: ${{ needs.prisma.result }}
          BRAND: ${{ needs.brand.result }}
          SEO: ${{ needs.seo.result }}
          PCCE: ${{ needs.pcce.result }}
          SECURITY: ${{ needs.security.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          printf 'lint=%s typecheck=%s prisma=%s brand=%s seo=%s pcce=%s security=%s build=%s\n' \
            "$LINT" "$TYPECHECK" "$PRISMA" "$BRAND" "$SEO" "$PCCE" "$SECURITY" "$BUILD"
          for result in "$LINT" "$TYPECHECK" "$PRISMA" "$BRAND" "$SEO" "$PCCE" "$SECURITY" "$BUILD"; do
            if [ "$result" != "success" ]; then
              echo "::error::One or more pre-deployment checks failed. Deployment must not proceed."
              exit 1
            fi
          done
          echo "All pre-deployment checks passed."
